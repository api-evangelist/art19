name: Art19
description: >-
  Art19 (ART19, Inc.) is a podcast hosting, distribution, and monetization platform, and an Amazon
  company. It provides publishers, networks, and enterprises with a content management system for
  audio, automated RSS feed generation, dynamic ad insertion and targeting through its WarpFeed feed
  technology, and an embeddable Web Player. The platform serves podcast delivery, analytics, and
  advertising workflows at scale. Art19 does not currently publish a public developer API, SDK, or
  documentation portal; its public presence consists of a marketing site, a contact page, a privacy
  policy, and a system status page tracking CMS, RSS, WarpFeed, and Web Player availability.
